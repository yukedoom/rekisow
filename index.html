.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}

.sec label{flex:1;cursor:pointer;min-width:0}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
button.p{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px 18px;font:inherit;font-weight:700;width:100%;cursor:pointer}
button.p:disabled{opacity:.4;cursor:not-allowed}

button.sm{padding:6px 10px;font-size:.85rem}

.ch:hover:not(:disabled){border-color:var(--ac)}
.ch.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.ch.ng{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}
input[type=text]{width:100%;padding:13px;font:inherit;font-size:1.1rem;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx)}
input[type=text]:focus{outline:0;border-color:var(--ac)}
.fb{border-radius:12px;padding:12px 14px;margin:12px 0}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.ng{background:var(--ngbg);color:var(--ng)}
.fb .ex{color:var(--tx);font-size:.92rem;margin-top:6px}

.big{font-size:2.4rem;font-weight:800;text-align:center;margin:8px 0}
.warn{background:var(--ngbg);color:var(--ng);padding:10px;border-radius:10px;font-size:.85rem}
ul.w{padding-left:1.1em;margin:6px 0}
</style>

{n:26,t:"日清戦争",i:[

["山県有朋内閣が、軍部の権限を強化するために制定した制度は＿＿である。","軍部大臣現役武官制"],
["伊藤博文が憲政党や官僚とともに結成した政党は＿＿である。","立憲政友会"]]}

/* ===== 処理 ===== */
const ALL=[];
D.forEach(s=>s.i.forEach((x,k)=>ALL.push({id:s.n+"-"+k,sec:s.n,t:s.t,q:x[0],a:x[1],alts:(x[2]||"").split("|").filter(Boolean)})));
const BLANK="＿＿";
function norm(s){return String(s).normalize("NFKC").toLowerCase().replace(/[\s・･=＝「」『』()（）、。]/g,"").replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));}
function accepts(it,v){const n=norm(v);return n!==""&&[it.a,...it.alts].some(x=>norm(x)===n);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeChoices(it){
  const bad=new Set([it.a,...it.alts].map(norm));
  const seen=new Set(bad),c=[];
  ALL.forEach(x=>{const n=norm(x.a);if(x.id===it.id||seen.has(n)||it.q.includes(x.a)||x.alts.some(y=>bad.has(norm(y))))return;seen.add(n);
    const sc=(x.a.slice(-1)===it.a.slice(-1)?3:0)+(Math.abs(x.a.length-it.a.length)<=1?1:0)+(x.sec===it.sec?1:0)+Math.random()*1.5;c.push([sc,x.a]);});
  c.sort((p,q)=>q[0]-p[0]);
  return shuffle([it.a,...c.slice(0,3).map(p=>p[1])]);
}
function validate(){
  const err=[],ids=new Set(),ans=new Map();
  ALL.forEach(x=>{
    if(ids.has(x.id))err.push("ID重複 "+x.id);ids.add(x.id);
    if(x.q.split(BLANK).length!==2)err.push("空欄が1つでない: "+x.q);
    if(x.q.includes(x.a)||x.alts.some(y=>x.q.includes(y)&&y.length>1))err.push("問題文に答えが含まれる: "+x.q);
    const n=norm(x.a);if(ans.has(n))err.push("答え重複: "+x.a+" / "+ans.get(n));ans.set(n,x.q);
    if(!x.a)err.push("答えが空 "+x.id);
  });
  ALL.forEach(x=>{const c=makeChoices(x);if(c.length!==4||new Set(c.map(norm)).size!==4||c.filter(v=>accepts(x,v)).length!==1)err.push("選択肢不正: "+x.q);});
  return err;
}
/* 保存（失敗しても動く） */
const KEY="rekisou-quiz-v1";
let store={stats:{},pref:{mode:"choice",count:20,sel:D.map(s=>s.n),onlyWrong:false}};
try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r&&r.stats&&r.pref)store={stats:r.stats,pref:Object.assign(store.pref,r.pref)};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
/* 状態 */
let S={screen:"home",queue:[],i:0,score:0,answered:false,cur:null,choices:[],log:[],overridden:false,resetArm:false,note:""};
const $=id=>document.getElementById(id);
const app=$("app");
function rec(id,ok){const s=store.stats[id]||{c:0,w:0,last:null};if(ok)s.c++;else s.w++;s.last=ok?1:0;store.stats[id]=s;save();}
function pool(){return ALL.filter(x=>store.pref.sel.includes(x.sec)&&(!store.pref.onlyWrong||(store.stats[x.id]&&store.stats[x.id].last===0)));}
function start(list){
  if(!list.length)return;
  const n=store.pref.count;S.queue=shuffle(list).slice(0,n>0?n:list.length);
  S.i=0;S.score=0;S.log=[];S.screen="quiz";loadQ();
}
function loadQ(){S.cur=S.queue[S.i];S.answered=false;S.overridden=false;S.choices=store.pref.mode==="choice"?makeChoices(S.cur):[];render();}
function judge(v){
  if(S.answered)return;
  const ok=accepts(S.cur,v);
  S.answered=true;S.last={ok,v};if(ok)S.score++;
  S.log.push({it:S.cur,ok,v});rec(S.cur.id,ok);render();
}
function override(){
  if(!S.answered||S.last.ok||S.overridden)return;
  S.overridden=true;S.last.ok=true;S.score++;S.log[S.log.length-1].ok=true;
  const s=store.stats[S.cur.id];s.w=Math.max(0,s.w-1);s.c++;s.last=1;save();render();
}
function next(){if(!S.answered)return;S.i++;if(S.i>=S.queue.length){S.screen="result";render();}else loadQ();}
/* 描画 */
function secBar(n){const l=ALL.filter(x=>x.sec===n);const m=l.filter(x=>store.stats[x.id]&&store.stats[x.id].last===1).length;return[m,l.length];}
function home(){
  const p=store.pref,pl=pool();
  let tot=0,mas=0;
  const rows=D.map(s=>{const[m,n]=secBar(s.n);tot+=n;mas+=m;
    return `<div class="sec"><input type="checkbox" id="c${s.n}" data-sec="${s.n}" ${p.sel.includes(s.n)?"checked":""}><label for="c${s.n}"><div>${s.n}節　${esc(s.t)}</div><div class="sub">習得 ${m} / ${n}問</div><div class="bar"><i style="width:${n?m/n*100:0}%"></i></div></label></div>`;}).join("");
  const wrongN=ALL.filter(x=>store.stats[x.id]&&store.stats[x.id].last===0).length;
  const bad=ERR.length?`<div class="warn">データ検査で ${ERR.length} 件の問題を検出: ${esc(ERR.slice(0,3).join(" / "))}</div>`:"";
  app.innerHTML=`<h1>歴史総合 一問一答</h1><div class="sub">幕末〜日露戦争後（19〜28節）／全${tot}問・習得 ${mas}問</div>${bad}
  <div class="card"><div class="sub">出題形式</div><div class="seg" style="margin:6px 0 14px"><button data-mode="choice" class="${p.mode==="choice"?"on":""}">4択</button><button data-mode="input" class="${p.mode==="input"?"on":""}">入力</button></div>
  <div class="sub">問題数</div><div class="seg" style="margin:6px 0 14px">${[10,20,0].map(n=>`<button data-count="${n}" class="${p.count===n?"on":""}">${n?n+"問":"全部"}</button>`).join("")}</div>
  <label class="row" style="cursor:pointer"><input type="checkbox" id="ow" ${p.onlyWrong?"checked":""} style="width:20px;height:20px"> 苦手だけ復習する（直近で間違えた ${wrongN}問）</label></div>
  <div class="card"><div class="row" style="justify-content:space-between"><b>出題する節</b><span class="row"><button class="s sm" id="all">全選択</button><button class="s sm" id="none">全解除</button></span></div>${rows}</div>
  <button class="p" id="go" ${pl.length?"":"disabled"}>${pl.length?`スタート（対象 ${pl.length}問）`:"対象の問題がありません"}</button>
  <p class="sub" style="text-align:center"><button class="s sm" id="rs">${S.resetArm?"本当に消す？もう一度押すと削除":"学習記録をリセット"}</button></p>`;
}
function quiz(){
  const it=S.cur,m=store.pref.mode,total=S.queue.length;
  const q=esc(it.q).replace(BLANK,S.answered?`<b>${esc(it.a)}</b>`:"<b>　？　</b>");
  let body="";
  if(m==="choice"){
    body=S.choices.map((c,k)=>{let cl="ch";if(S.answered){if(accepts(it,c))cl+=" ok";else if(!S.last.ok&&c===S.last.v)cl+=" ng";}
      return `<button class="${cl}" data-ch="${k}" ${S.answered?"disabled":""}>${k+1}. ${esc(c)}</button>`;}).join("");
  }else{
    body=`<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="漢字で入力（カタカナ/ひらがな不問）" ${S.answered?"disabled":""} value="${S.answered?esc(S.last.v):""}"><div style="margin-top:10px">${S.answered?"":`<button class="p" id="sub">答える</button>`}</div>`;
  }
  let fb="";
  if(S.answered){
    const ok=S.last.ok;
    fb=`<div class="fb ${ok?"ok":"ng"}"><b>${ok?(S.overridden?"正解にしました":"正解！"):"不正解　正解は「"+esc(it.a)+"」"}</b>${it.alts.length?`<div class="sub">別解：${esc(it.alts.join("、"))}</div>`:""}<div class="ex">${esc(it.q.replace(BLANK,it.a))}<br><span class="sub">（${it.sec}節 ${esc(it.t)}）</span></div></div>
    <div class="row">${!ok&&m==="input"&&!S.overridden?`<button class="s" id="ov">表記ゆれなので正解にする</button>`:""}<button class="p" id="nx" style="flex:1">${S.i+1>=total?"結果を見る":"次へ"}</button></div>`;
  }
  app.innerHTML=`<div class="row" style="justify-content:space-between"><span class="sub">${S.i+1} / ${total}　正解 ${S.score}</span><button class="s sm" id="quit">やめる</button></div>
  <div class="prog"><i style="width:${(S.i+(S.answered?1:0))/total*100}%"></i></div>
  <div class="card"><div class="sub">${it.sec}節 ${esc(it.t)}</div><div class="q">${q}</div>${body}${fb}</div>`;
  if(S.answered){const n=$("nx");if(n)n.focus();}else if(m==="input"){const a=$("ans");if(a)a.focus();}
}
function result(){
  const n=S.log.length,ok=S.log.filter(x=>x.ok).length,ng=S.log.filter(x=>!x.ok);
  app.innerHTML=`<h1>結果</h1><div class="card"><div class="big">${ok} / ${n}</div><div class="sub" style="text-align:center">正答率 ${n?Math.round(ok/n*100):0}%</div></div>
  ${ng.length?`<div class="card"><b>間違えた問題</b><ul class="w">${ng.map(x=>`<li>${esc(x.it.q.replace(BLANK,"【"+x.it.a+"】"))}</li>`).join("")}</ul></div>`:`<div class="card">全問正解です！</div>`}
  <div class="row">${ng.length?`<button class="p" id="rt" style="flex:1">間違えた問題だけもう一度</button>`:""}<button class="s" id="hm" style="flex:1;padding:14px">ホームへ</button></div>`;
}
function render(){window.scrollTo(0,0);if(S.screen==="home")home();else if(S.screen==="quiz")quiz();else result();}
/* イベント（委譲） */
app.addEventListener("click",e=>{
  const t=e.target.closest("button");
  if(!t)return;
  const d=t.dataset;
  if(d.mode){store.pref.mode=d.mode;save();render();}
  else if(d.count!==undefined){store.pref.count=+d.count;save();render();}
  else if(d.ch!==undefined){judge(S.choices[+d.ch]);}
  else if(t.id==="go"){S.resetArm=false;start(pool());}
  else if(t.id==="all"){store.pref.sel=D.map(s=>s.n);save();render();}
  else if(t.id==="none"){store.pref.sel=[];save();render();}
  else if(t.id==="rs"){if(S.resetArm){store.stats={};save();S.resetArm=false;}else S.resetArm=true;render();}
  else if(t.id==="sub"){const a=$("ans");if(a&&norm(a.value)!=="")judge(a.value);else if(a)a.focus();}
  else if(t.id==="ov")override();
  else if(t.id==="nx")next();
  else if(t.id==="quit"||t.id==="hm"){S.screen="home";S.resetArm=false;render();}
  else if(t.id==="rt"){start(S.log.filter(x=>!x.ok).map(x=>x.it));}
});
app.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.sec){const n=+t.dataset.sec,s=new Set(store.pref.sel);t.checked?s.add(n):s.delete(n);store.pref.sel=D.map(x=>x.n).filter(x=>s.has(x));save();render();}
  else if(t.id==="ow"){store.pref.onlyWrong=t.checked;save();render();}
});
app.addEventListener("keydown",e=>{
  if(e.target.id==="ans"&&e.key==="Enter"&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(norm(e.target.value)!=="")judge(e.target.value);}
});
document.addEventListener("keydown",e=>{
  if(S.screen!=="quiz"||e.isComposing||e.target.tagName==="INPUT")return;
  if(!S.answered&&store.pref.mode==="choice"&&/^[1-4]$/.test(e.key)){judge(S.choices[+e.key-1]);}
});
const ERR=validate();if(ERR.length)console.error(ERR);
render();
</script>
