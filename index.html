h1{font-size:1.25rem;font-weight:700;margin:0 0 4px;letter-spacing:.02em}
.sub{color:var(--sub);font-size:.85rem}

.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line);background:transparent;color:var(--tx);padding:11px 0;font:inherit;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.sec{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}

.sec span:first-of-type{flex:1}.sec .n{color:var(--sub);font-size:.8rem;flex:none}

button.p{display:block;width:100%;background:var(--ink);color:var(--onink);border:0;border-radius:12px;padding:15px;font:inherit;font-weight:700;cursor:pointer;margin-top:28px}
button.p:disabled{opacity:.3;cursor:not-allowed}
button.t{background:none;border:0;color:var(--sub);font:inherit;font-size:.85rem;cursor:pointer;padding:4px 0}
.top{display:flex;justify-content:space-between;align-items:center}
.prog{height:2px;background:var(--line);margin:10px 0 28px}.prog i{display:block;height:100%;background:var(--ink)}
.q{font-size:1.2rem;line-height:2;margin:8px 0 24px}
.bl{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--tx);text-align:center;font-weight:700}
.bl.ok{color:var(--ok);border-color:var(--ok)}.bl.ng{color:var(--ng);border-color:var(--ng)}
.ch{display:block;width:100%;text-align:left;margin:0 0 10px;padding:14px 16px;background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:12px;font:inherit;cursor:pointer}
.ch:disabled{cursor:default}
.ch:hover:not(:disabled){border-color:var(--tx)}
.ch.ok{border-color:var(--ok);color:var(--ok);font-weight:700}
.ch.ng{border-color:var(--ng);color:var(--ng)}
input[type=text]{width:100%;padding:14px 16px;font:inherit;font-size:1.05rem;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--tx)}
input[type=text]:focus{outline:0;border-color:var(--tx)}
.fb{margin:22px 0 0;padding:2px 0 2px 14px;border-left:3px solid var(--ok)}.fb.ng{border-color:var(--ng)}
.fb b.ok{color:var(--ok)}.fb b.ng{color:var(--ng)}
.fb .ex{font-size:.9rem;color:var(--sub);margin-top:6px}
.big{font-size:3rem;font-weight:700;margin:28px 0 0;line-height:1.2}
.warn{color:var(--ng);font-size:.8rem;margin-top:12px}
ul.w{padding-left:1.1em;margin:8px 0;font-size:.92rem}ul.w li{margin-bottom:6px}
</style>

/* ===== 処理 ===== */
const ALL=[];
D.forEach(s=>s.i.forEach((x,k)=>ALL.push({id:s.n+"-"+k,sec:s.n,t:s.t,q:x[0],a:x[1],alts:(x[2]||"").split("|").filter(Boolean),ext:(x[3]||"").split("|").filter(Boolean)})));
const BLANK="＿＿";
function norm(s){return String(s).normalize("NFKC").toLowerCase().replace(/[\s・･=＝「」『』()（）、。]/g,"").replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));}
function accepts(it,v){const n=norm(v);return n!==""&&[it.a,...it.alts].some(x=>norm(x)===n);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const PEOPLE=new Set("和宮 坂本龍馬 徳川慶喜 岩倉具視 大久保利通 大院君 西郷隆盛 閔妃 金玉均 大隈重信 前島密 植木枝盛 伊藤博文 ロエスレル 陸奥宗光 小村寿太郎 リヴィングストン スタンリー セシル=ローズ 康有為 光緒帝 西太后 安重根 渋沢栄一".split(" "));
const OVR={"国会期成同盟":"org","アイヌ":"ethnic","マオリ":"ethnic","アボリジナル":"ethnic","ドイツ":"nation","ロシア":"nation","キューバ":"nation","エチオピア":"nation","リベリア":"nation","ハワイ":"nation","東京":"place","小笠原諸島":"place","遼東半島":"place","パナマ":"place","大韓帝国":"nation"};
function kind(x){
  const a=x.a;
  if(OVR[a])return OVR[a];if(PEOPLE.has(a))return"person";
  if(/^[\d第]/.test(a))return"num";
  if(/(会議|事件|政変|戦争|軍乱|一揆|干渉|変|乱)$/.test(a))return"event";
  if(/(条約|条規|協商|同盟)$/.test(a))return"treaty";
  if(/(令|条例|法|勅語|勅諭|憲法|典範|書|誓文|掲示|告諭|憲按|制度|政策|処分|令)$/.test(a))return"law";
  if(/(党|社|隊|内閣|使|議院|議会|館|場|府|兵)$/.test(a))return"org";
  return"other";
}
const KIND=new Map();
function kd(x){if(!KIND.has(x.id))KIND.set(x.id,kind(x));return KIND.get(x.id);}
function makeChoices(it){
  const bad=new Set([it.a,...it.alts].map(norm));
  const seen=new Set(bad),c=[],ke=kd(it);
  const extra=it.ext.filter(v=>!seen.has(norm(v))).slice(0,3);extra.forEach(v=>seen.add(norm(v)));
  ALL.forEach(x=>{const n=norm(x.a);if(x.id===it.id||seen.has(n)||it.q.includes(x.a)||x.alts.some(y=>bad.has(norm(y))))return;seen.add(n);
    const sc=(kd(x)===ke?10:0)+(x.a.slice(-1)===it.a.slice(-1)?2:0)+(Math.abs(x.a.length-it.a.length)<=1?1:0)+(x.sec===it.sec?2:0)+Math.random()*2;c.push([sc,x.a]);});
  c.sort((p,q)=>q[0]-p[0]);
  return shuffle([it.a,...extra,...c.slice(0,3-extra.length).map(p=>p[1])]);
}
function validate(){
  const err=[],ids=new Set(),ans=new Map();
  ALL.forEach(x=>{
    if(ids.has(x.id))err.push("ID重複 "+x.id);ids.add(x.id);
    if(x.q.split(BLANK).length!==2)err.push("空欄が1つでない: "+x.q);
    if(x.q.includes(x.a)||x.alts.some(y=>x.q.includes(y)&&y.length>1))err.push("問題文に答えが含まれる: "+x.q);
    const n=norm(x.a);if(ans.has(n))err.push("答え重複: "+x.a+" / "+ans.get(n));ans.set(n,x.q);
    if(!x.a)err.push("答えが空 "+x.id);
  });
  ALL.forEach(x=>{const c=makeChoices(x);if(c.length!==4||new Set(c.map(norm)).size!==4||c.filter(v=>accepts(x,v)).length!==1)err.push("選択肢不正: "+x.q);});
  return err;
}
/* 保存（失敗しても動く） */
const KEY="rekisou-quiz-v1";
let store={stats:{},pref:{mode:"choice",count:20,sel:D.map(s=>s.n),onlyWrong:false}};
try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r&&r.stats&&r.pref)store={stats:r.stats,pref:Object.assign(store.pref,r.pref)};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
/* 状態 */
let S={lock:0,screen:"home",queue:[],i:0,score:0,answered:false,cur:null,choices:[],log:[],note:""};
const $=id=>document.getElementById(id);
const app=$("app");
function rec(id,ok){const s=store.stats[id]||{c:0,w:0,last:null};if(ok)s.c++;else s.w++;s.last=ok?1:0;store.stats[id]=s;save();}
function pool(){return ALL.filter(x=>store.pref.sel.includes(x.sec)&&(!store.pref.onlyWrong||(store.stats[x.id]&&store.stats[x.id].last===0)));}
function start(list,all){
  if(!list.length)return;
  const n=all?0:store.pref.count;S.queue=shuffle(list).slice(0,n>0?n:list.length);
  S.i=0;S.score=0;S.log=[];S.screen="quiz";loadQ();
}
function loadQ(){S.cur=S.queue[S.i];S.answered=false;S.lock=Date.now()+350;S.choices=store.pref.mode==="choice"?makeChoices(S.cur):[];render();}
function judge(v){
  if(S.answered||Date.now()<S.lock)return;
  const skip=v===null,ok=!skip&&accepts(S.cur,v);
  S.answered=true;S.last={ok,v:skip?"":v,skip};if(ok)S.score++;
  S.log.push({it:S.cur,ok,v});rec(S.cur.id,ok);render();
}
function next(){if(!S.answered)return;S.i++;if(S.i>=S.queue.length){S.screen="result";render();}else loadQ();}
/* 描画 */
function home(){
  const p=store.pref,pl=pool();
  const rows=D.map(s=>`<label class="sec"><input type="checkbox" data-sec="${s.n}" ${p.sel.includes(s.n)?"checked":""}><span>${s.n}　${esc(s.t)}</span><span class="n">${ALL.filter(x=>x.sec===s.n).length}問</span></label>`).join("");
  const wrongN=ALL.filter(x=>store.stats[x.id]&&store.stats[x.id].last===0).length;
  const bad=ERR.length?`<div class="warn">データ検査で ${ERR.length} 件の問題を検出: ${esc(ERR.slice(0,3).join(" / "))}</div>`:"";
  app.innerHTML=`<h1>歴史総合 一問一答</h1><div class="sub">幕末〜日露戦争後（19〜28節）</div>${bad}
  <div class="lbl">形式</div><div class="seg"><button data-mode="choice" class="${p.mode==="choice"?"on":""}">4択</button><button data-mode="input" class="${p.mode==="input"?"on":""}">入力</button></div>
  <div class="lbl">問題数</div><div class="seg">${[10,20,0].map(n=>`<button data-count="${n}" class="${p.count===n?"on":""}">${n?n+"問":"全部"}</button>`).join("")}</div>
  <div class="lbl">範囲</div>${rows}
  <label class="opt"><input type="checkbox" id="ow" ${p.onlyWrong?"checked":""}><span>間違えた問題だけ（${wrongN}問）</span></label>
  <button class="p" id="go" ${pl.length?"":"disabled"}>${pl.length?`はじめる（${pl.length}問から出題）`:"対象の問題がありません"}</button>`;
}
function quiz(){
  const it=S.cur,m=store.pref.mode,total=S.queue.length;
  const q=esc(it.q).replace(BLANK,S.answered?`<span class="bl ${S.last.ok?"ok":"ng"}">${esc(it.a)}</span>`:`<span class="bl">&nbsp;</span>`);
  let body="";
  if(m==="choice"){
    body=S.choices.map((c,k)=>{let cl="ch";if(S.answered){if(accepts(it,c))cl+=" ok";else if(!S.last.ok&&c===S.last.v)cl+=" ng";}
      return `<button class="${cl}" data-ch="${k}" ${S.answered?"disabled":""}>${esc(c)}</button>`;}).join("");
  }else{
    body=`<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを入力" ${S.answered?"disabled":""} value="${S.answered?esc(S.last.v):""}">${S.answered?"":`<button class="p" id="sub" style="margin-top:12px">答える</button>`}`;
  }
  if(!S.answered)body+=`<div style="text-align:center;margin-top:14px"><button class="t" id="skip">わからない</button></div>`;
  let fb="";
  if(S.answered){
    const ok=S.last.ok;
    fb=`<div class="fb ${ok?"":"ng"}"><b class="${ok?"ok":"ng"}">${ok?"正解":(S.last.skip?"わからない":"不正解")+"　正解は「"+esc(it.a)+"」"}</b><div class="ex">${esc(it.q.replace(BLANK,it.a))}（${it.sec}節 ${esc(it.t)}）</div></div>
    <button class="p" id="nx">${S.i+1>=total?"結果を見る":"次へ"}</button>`;
  }
  app.innerHTML=`<div class="top"><span class="sub">${S.i+1} / ${total}</span><button class="t" id="quit">やめる</button></div>
  <div class="prog"><i style="width:${(S.i+(S.answered?1:0))/total*100}%"></i></div>
  <div class="q">${q}</div>${body}${fb}`;
  if(S.answered){const n=$("nx");if(n)n.focus();}else if(m==="input"){const a=$("ans");if(a)a.focus();}
}
function result(){
  const n=S.log.length,ok=S.log.filter(x=>x.ok).length,ng=S.log.filter(x=>!x.ok);
  app.innerHTML=`<h1>結果</h1><div class="big">${ok} / ${n}</div><div class="sub">正答率 ${n?Math.round(ok/n*100):0}%</div>
  ${ng.length?`<div class="lbl">間違えた問題</div><ul class="w">${ng.map(x=>`<li>${esc(x.it.q.replace(BLANK,"【"+x.it.a+"】"))}</li>`).join("")}</ul>`:`<div class="lbl">全問正解です</div>`}
  ${ng.length?`<button class="p" id="rt">間違えた問題をもう一度</button>`:""}<button class="p" id="hm" style="background:transparent;color:var(--tx);border:1px solid var(--line);margin-top:12px">ホームへ</button>`;
}
function render(keep){const y=window.scrollY||0;window.scrollTo(0,keep?y:0);if(S.screen==="home")home();else if(S.screen==="quiz")quiz();else result();if(keep)window.scrollTo(0,y);}
/* イベント（委譲） */
app.addEventListener("click",e=>{
  const t=e.target.closest("button");
  if(!t)return;
  const d=t.dataset;
  if(d.mode){store.pref.mode=d.mode;save();render(true);}
  else if(d.count!==undefined){store.pref.count=+d.count;save();render(true);}
  else if(d.ch!==undefined){judge(S.choices[+d.ch]);}
  else if(t.id==="go"){start(pool());}
  else if(t.id==="sub"){const a=$("ans");if(a&&norm(a.value)!=="")judge(a.value);else if(a)a.focus();}
  else if(t.id==="skip")judge(null);
  else if(t.id==="nx")next();
  else if(t.id==="quit"||t.id==="hm"){S.screen="home";render();}
  else if(t.id==="rt"){start(S.log.filter(x=>!x.ok).map(x=>x.it),true);}
});
app.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.sec){const n=+t.dataset.sec,s=new Set(store.pref.sel);t.checked?s.add(n):s.delete(n);store.pref.sel=D.map(x=>x.n).filter(x=>s.has(x));save();render(true);}
  else if(t.id==="ow"){store.pref.onlyWrong=t.checked;save();render(true);}
});
app.addEventListener("keydown",e=>{
  if(e.target.id==="ans"&&e.key==="Enter"&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(norm(e.target.value)!=="")judge(e.target.value);}
});
const ERR=validate();if(ERR.length)console.error(ERR);
render();
</script>
